<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test CORS</title>
  </head>
  <body>
    <h1>Test CORS</h1>
    <button onclick="fetchData()">Try</button>

    <script>
      async function fetchData() {
        try {
          const response = await fetch("http://127.0.0.1:3000/test", {
            method: "GET",
          });
          const data = await response.json();
          console.log(data);
          alert("Success!");
        } catch (error) {
          console.error(error);
          alert("Error!");
        }
      }
    </script>
  </body>
</html>
